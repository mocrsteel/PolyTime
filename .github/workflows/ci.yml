name: CI

on:
  push:
    branches: [main, 'mvp/**', 'copilot/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise run install

      - name: Run ESLint
        run: mise run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise run install

      - name: Run TypeScript type check
        run: mise run typecheck

  test:
    name: Storybook Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise run install

      - name: Install Playwright browsers
        run: mise run playwright:install

      - name: Run Storybook tests
        run: mise run test:storybook

      - name: Run unit tests
        run: mise run test:unit
