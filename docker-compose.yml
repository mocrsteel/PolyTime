# development postgres config.

services:
  db:
    image: postgres:18
    container_name: postgres-dev
    environment:
      POSTGRES_USER: ${DATABASE_USER?error}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD?error}
      POSTGRES_DB: ${DATABASE_NAME?error}
    ports:
      - ${DATABASE_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
